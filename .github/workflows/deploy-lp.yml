name: deploy lp

on:
  push:
    branches: [main]
    paths:
      - 'lp/**'
      - 'docs/politica-de-privacidade.md'
      - 'docs/termos-de-uso.md'
      - 'docs/exclusao-de-dados.md'
      - '.github/workflows/deploy-lp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-lp
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: vera-site-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERA_DOMAIN: ${{ vars.VERA_DOMAIN }}
      VERA_HOST_PREFIX: ${{ vars.VERA_HOST_PREFIX }}
    defaults:
      run:
        working-directory: lp
    steps:
      - name: Gate
        id: gate
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$VERA_DOMAIN" ]; then
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or VERA_DOMAIN is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lp/package-lock.json

      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'

      - run: npm run build
        if: steps.gate.outputs.enabled == 'true'
        env:
          SITE_URL: https://vera.${{ vars.VERA_DOMAIN }}
          PUBLIC_APP_URL: https://${{ vars.VERA_HOST_PREFIX }}app.${{ vars.VERA_DOMAIN }}

      - uses: cloudflare/wrangler-action@v3
        if: steps.gate.outputs.enabled == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lp
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Smoke
        if: steps.gate.outputs.enabled == 'true'
        run: |
          for path in / /privacidade/ /termos/ /exclusao-de-dados/; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "https://vera.${VERA_DOMAIN}${path}"
          done
