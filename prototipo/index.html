<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo Vera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de duas colunas, navegação à esquerda e área de trabalho à direita, com cabeçalho fixo no topo; tema claro com base rosa; no celular a navegação vira faixa rolável no topo.
   Base de componentes (tipografia, densidade, cards, botões, campos, segmentado, estados vazios, configurações) alinhada ao design da própria Vera. */
:root{
  color-scheme:light;
  --bg:#fbf6f8; --surface:#ffffff; --surface-2:#f8eff3; --hover:#f6ebf0; --ink:#2a1822; --ink-2:#64505b; --ink-3:#8c7783; --line:#f0e1e8;
  --accent:#e0407b; --accent-strong:#bf2a62; --accent-ink:#ffffff; --accent-soft:#fde6ef; --accent-tint:#fff3f8;
  --good:#1b8f63; --good-soft:#dbf2e7; --warn:#c2620d; --warn-soft:#fdead6; --bad:#c32d3a; --bad-soft:#fbdfe2;
  --c-rf_pos:#5868d6; --c-rf_pre:#8b78e3; --c-rf_ipca:#b45bd0; --c-acoes_br:#e0407b; --c-fii:#ef8657; --c-acoes_eua:#22968a; --c-reits:#e6a92c; --c-cripto:#6d3a5f;
  --f-display:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --f-wordmark:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:20px; --rc:12px; --px:clamp(16px,2.4vw,28px); --cw:1120px;
  --shadow:0 1px 2px rgba(40,18,30,.04),0 6px 20px -6px rgba(40,18,30,.08); --shadow-hover:0 2px 4px rgba(40,18,30,.04),0 16px 40px -12px rgba(120,30,70,.16); --shadow-top:0 1px 2px rgba(40,18,30,.03),0 6px 16px -10px rgba(40,18,30,.14); --shadow-brand:0 6px 16px -6px rgba(224,64,123,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance}p{text-wrap:pretty}
::selection{background:var(--accent-soft);color:var(--accent-strong)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
a{color:var(--accent-strong);font-weight:600}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-wordmark);font-size:24px;font-weight:700;letter-spacing:-.045em;line-height:.9}
.brand b::after{content:".";color:var(--accent)}
.brand small{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h6{margin:0;padding:12px 14px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;border-radius:var(--rc);color:var(--ink-2);font-weight:600;font-size:14px;border:0;background:none;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s}
.nav svg{width:17px;height:17px}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.nav .count{margin-left:auto;font-size:11px;background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-weight:700}
.main{min-width:0;padding-inline:var(--px);padding-block:0 60px}
.page{max-width:var(--cw);margin-inline:auto}
.head{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;min-height:68px;margin:0 calc(-1 * var(--px)) 22px;padding:12px max(var(--px), calc((100% - var(--cw)) / 2 + var(--px)));background:var(--surface);box-shadow:var(--shadow-top)}
.head h1{font-family:var(--f-body);font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0}
.head p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px;max-width:90ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:30px;padding:4px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-family:var(--f-body);font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;line-height:1.3}
.card h2 + p{margin:0 0 16px;color:var(--ink-2);font-size:13px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.herocard{position:relative}
.big{font-family:var(--f-body);font-weight:800;font-size:clamp(30px,4vw,38px);letter-spacing:-.03em;line-height:1;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:800;display:flex;align-items:center;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12.5px}
.pill svg{color:var(--ink-3)}
.pill b{font-weight:700}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:var(--rc);background:var(--surface-2)}
.callout svg{color:var(--ink-3)}
.stackwrap{display:grid;gap:12px}
.stackrow{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.stack{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%;border-right:2px solid var(--surface);cursor:pointer;transition:filter .15s}
.stack span:hover,.stack span.hl{filter:brightness(1.12) saturate(1.1)}
.stack.meta span{opacity:.5}
.stack.meta span:hover{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hint{font-size:12px;color:var(--ink-2);margin-top:10px;display:flex;align-items:center;gap:6px}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:800;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.tile{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;flex:none}
.tile svg{width:17px;height:17px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.cname{font-weight:600}
.sub{display:block;font-size:12px;color:var(--ink-2);font-weight:400}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gauge{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:120px;cursor:pointer}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.gauge .tgt{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:22px;font-size:12px;line-height:1;font-weight:700;border-radius:99px;padding:0 9px;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.up{background:var(--warn-soft);color:var(--warn)}
.chip.down{background:var(--accent-soft);color:var(--accent-strong)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:var(--hover);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:var(--rc);cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,filter .15s}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-brand)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--bad-soft);color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--ink)}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;min-width:0;width:100%;font-size:15px;transition:border-color .15s}
.input::placeholder{color:var(--ink-3)}
.input[readonly]{background:var(--surface-2)}
.input:focus{border-color:color-mix(in srgb,var(--accent) 45%,transparent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}
.input.num{text-align:right}
.input.tiny{width:76px;padding:5px 8px;font-size:14px;border-radius:9px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.searchbox .input{padding-left:38px;font-size:15px;padding-block:11px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--accent-strong)}
.stepper button:hover{background:var(--accent-tint)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--rc);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.note > svg{color:var(--ink-3);margin-top:2px}
.note b{color:var(--ink)}
.back{border:0;background:none;color:var(--accent-strong);font-weight:700;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.kpi .label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.kpisub{font-size:12.5px;color:var(--ink-3)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.focus{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.kpi.focus .v{color:var(--accent-strong)}
.hbar{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) 110px;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.hbar:last-child{border-bottom:0}
.hbar .track{height:12px;background:var(--surface-2);border-radius:6px;position:relative;cursor:pointer}
.hbar .track span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#b9a3af}
.hbar .track span.flex{background:var(--accent)}
.hbar .track span.unc{background:var(--warn)}
.hbar .track i{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.tog{border:0;background:var(--surface-2);color:var(--ink-2);font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.tog.on{background:var(--accent-soft);color:var(--accent-strong)}
.tx{display:grid;grid-template-columns:36px 54px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .d{font-size:12.5px;color:var(--ink-2)}
.tx .m{font-weight:600;overflow-wrap:anywhere}
.tx.unc{background:linear-gradient(90deg,var(--warn-soft),transparent 75%);margin:0 -12px;padding-inline:12px;border-radius:12px}
.fix{grid-column:3 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.howto{display:grid;gap:0;margin:0;padding:0;list-style:none;counter-reset:s}
.howto > li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.howto > li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;position:relative;z-index:1}
.howto > li:not(:last-child)::after{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--accent-soft)}
.howto > li.done::before{content:"✓";background:var(--good)}
.howto h4{margin:6px 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.howto ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px;display:grid;gap:4px}
.howto .url{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:8px;padding:3px 9px;text-decoration:none;color:var(--accent-strong);font-weight:500}
.howto .url:hover{background:var(--accent-soft)}
.kbd{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink)}
.warnbox{background:var(--warn-soft);color:var(--ink-2);border-radius:var(--rc);padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.warnbox svg{color:var(--warn);margin-top:2px}
.warnbox b{color:var(--ink)}
.conn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.bank{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.modal{position:fixed;inset:0;background:rgba(30,12,22,.45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:min(980px,100%);height:min(720px,calc(100% - 32px));display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 1px 3px rgba(40,18,30,.07),0 24px 60px -20px rgba(40,18,30,.4);overflow:hidden}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 12px}
.sheet-head h3{font-family:var(--f-body);font-weight:800;margin:0;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sheet-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:0}
.sheet-left{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.sheet-right{padding:18px 22px;overflow:auto;background:var(--surface-2);border-left:1px solid var(--line)}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.results{display:grid;gap:6px}
.result{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.result:hover{border-color:var(--line);background:var(--hover)}
.result[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.preview{display:grid;gap:14px}
.preview .ptitle{display:flex;align-items:center;gap:12px}
.preview .ptitle .tile{width:46px;height:46px;border-radius:14px}
.preview .ptitle .tile svg{width:22px;height:22px}
.preview .ptitle b{font-size:20px;font-weight:800;display:block;line-height:1.15}
.pvalue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.pvalue .big{font-size:30px;margin:4px 0 2px}
.empty{display:grid;place-items:center;text-align:center;height:100%;color:var(--ink-2);gap:10px;padding:30px}
.empty svg{width:44px;height:44px;color:var(--accent);opacity:.5;stroke-width:1.5}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--rc);font-weight:600;font-size:13.5px;z-index:30;box-shadow:var(--shadow-hover);display:flex;gap:8px;align-items:center}
.toast svg{color:#ff9cc2}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;min-width:190px;box-shadow:0 12px 28px rgba(60,15,38,.3)}
.tip .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tip .t i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip .l{display:flex;justify-content:space-between;gap:16px;color:#e9d6df}
.tip .l b{color:#fff;font-family:var(--f-mono);font-weight:500}
.tip .s{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.15);font-weight:600}
.alloc{display:grid;gap:12px}
.allocclass{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.allocclass header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px}
.allocclass header .amt{margin-left:auto;font-family:var(--f-display);font-size:20px;color:var(--accent-strong)}
.allocasset{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;padding:9px 14px 9px 60px;border-top:1px solid var(--line);font-size:13.5px}
.onb{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.onb-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px clamp(16px,4vw,40px)}

.setrow .sico{width:36px;height:36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center}
.setrow .sico svg{width:17px;height:17px}
.setrow b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.setrow .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.prefix{display:inline-flex;align-items:center;padding:0 12px;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-weight:600;color:var(--ink-2)}
.cfg-layout{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:24px;align-items:start}
.cfg-nav{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px}
.cfg-nav button{border:0;background:none;text-align:left;min-height:38px;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.cfg-nav button:hover{background:var(--hover);color:var(--ink)}
.cfg-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.cfg-body{display:grid;gap:16px;min-width:0}
.cfg-body > .card .field + .row,.cfg-body > .card .field + .check,.cfg-body > .card .check + .row,.cfg-body > .card .tipbox + .field{margin-top:14px}
.proto-card{background:var(--surface-2);box-shadow:none}
.wa-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:16px;align-items:start}
.evt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.evt:last-child{border-bottom:0}
.evt .when{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:2px 8px;white-space:nowrap}
.bubble{max-width:86%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.07)}
.phone{width:100%;max-width:380px;height:600px;border-radius:24px;border:1px solid var(--line);background:#efe9e4;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.wa-top{background:#17936a;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
.wa-top .logo{width:32px;height:32px;border-radius:50%}
.wa-top b{display:block;font-size:14px}
.wa-top span{font-size:11.5px;opacity:.85}
.wa-body{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.wa-body .bubble.me{align-self:flex-end;background:#d9fbe9;color:#14261c;border-bottom-right-radius:3px}
.wa-body .bubble.vera{align-self:flex-start;background:#fff;border-bottom-left-radius:3px}
.wa-body .sys{align-self:center;background:#fff6dc;color:#6b5412;font-size:12px;border-radius:8px;padding:5px 10px;text-align:center;max-width:92%}
.wa-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0}
.wa-chips .fchip{white-space:nowrap;background:#fff}
.fchip[disabled]{opacity:.5;cursor:not-allowed}
.wa-bar{display:flex;gap:8px;padding:8px 10px 12px}
.wa-bar .input{border-radius:99px;border-color:#fff;padding:9px 14px}
.wa-bar button{width:40px;height:40px;border-radius:50%;border:0;background:#17936a;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.wa-bar button[disabled]{opacity:.45;cursor:not-allowed}
.codein{font-family:var(--f-mono);font-size:20px;letter-spacing:.35em;text-align:center}
.payload{font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--rc);padding:14px;margin:0;overflow:auto;max-height:340px;white-space:pre}
.sheet.narrow{width:min(560px,100%);height:auto;max-height:calc(100% - 32px)}
.sheet.mid{width:min(860px,100%);height:auto;max-height:calc(100% - 32px)}
.sheet.narrow .sheet-single,.sheet.mid .sheet-body{overflow:auto}
.sheet-left > .seg{align-self:flex-start}
.qr{width:160px;height:160px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;flex:none}
.pixbox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}.switch,.switch::after,.meter span{transition:none}}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;margin-top:12px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2)}
.offer b{display:block}
.offer .d{display:block;color:var(--ink-2);font-size:13.5px}
@media (max-width:1100px){.wa-grid{grid-template-columns:minmax(0,1fr)}.phone{justify-self:center}}
@media (max-width:900px){.cfg-layout{grid-template-columns:minmax(0,1fr)}.cfg-nav{position:static;flex-direction:row;overflow-x:auto;gap:6px}.cfg-nav button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;min-height:32px;padding:4px 12px;font-size:13px;background:var(--surface)}}
@media (max-width:820px){.head{position:static}}
@media (max-width:720px){.plans{grid-template-columns:minmax(0,1fr)}}
@media (max-width:540px){.setrow{grid-template-columns:36px minmax(0,1fr)}.setrow .actions{grid-column:1 / -1;justify-content:flex-start}.offer{grid-template-columns:minmax(0,1fr)}.phone{height:540px}}

function assetTargetsFor(cls, tickers) {
  const out = {};
  if (assetTargets[cls]) { tickers.forEach(tk => { out[tk] = assetTargets[cls][tk] ?? 0; }); return out; }
  const each = tickers.length ? 100 / tickers.length : 0;
  tickers.forEach(tk => { out[tk] = Math.round(each * 10) / 10; });
  return out;
}

function status(dev, tol = state.tol) {
  if (Math.abs(dev) <= tol) return `<span class="chip ok">${ic('check')}na faixa</span>`;

}

function gauge(share, target, color, tipAttrs) {
  const max = Math.max(share, target, 1) * 1.25;
  return `<div class="gauge" ${tipAttrs}><div class="fill" style="width:${share / max * 100}%;background:${color}"></div><div class="tgt" style="left:calc(${target / max * 100}% - 1px)"></div></div>`;
}

function allocate(amount, items) {
  const total = items.reduce((s, i) => s + i.current, 0) + amount;
  const needs = items.map(i => Math.max(0, i.target / 100 * total - i.current));
  const sumN = needs.reduce((a, b) => a + b, 0);
  const tp = items.reduce((s, i) => s + i.target, 0) || 1;
  if (sumN <= 0) return items.map(i => amount * i.target / tp);
  if (sumN >= amount) return needs.map(n => amount * n / sumN);
  return needs.map((n, k) => n + (amount - sumN) * items[k].target / tp);
}

screens.aporte = () => {
  const {total, rows} = classRows();

  const newTotal = total + amount;
  const blocks = rows.map((r, i) => ({r, a:alloc[i]})).filter(x => x.a >= 1).sort((a, b) => b.a - a.a);
  return `
  <div class="head"><div>${title('zap', 'Onde aportar')}<p>Diga quanto vai investir e veja onde colocar para aproximar a carteira da meta, sem vender nada (vender gera imposto).</p></div><div class="controls">${baseSeg()}</div></div>
  <section class="card herocard">
    <div class="row" style="align-items:flex-end;gap:16px">
      <div class="field" style="max-width:260px"><label for="aporte">Quanto você vai aportar (R$)</label><input class="input num" style="font-size:20px;font-family:var(--f-display)" id="aporte" type="number" min="0" step="500" value="${amount}" data-aporte></div>
      <div class="row">${[5000, 10000, 25000, 50000].map(v => `<button class="btn sm" data-aporte-quick="${v}">${brl.format(v)}</button>`).join('')}</div>
    </div>
  </section>
  <div class="alloc" style="margin-top:16px">

      const after = (r.value + a) / newTotal * 100;
      const {groups} = assetGroups(r.cls);
      let assets = '';

          const s = g.sample;

};

/* vencimentos, taxa real, FGC e concentração */
const fmtDate = iso => iso.split('-').reverse().join('/');
const daysTo = iso => Math.round((new Date(iso + 'T12:00:00') - NOW) / DAY);
const whenTxt = d => d <= 60 ? `em ${d} dias` : d < 730 ? `em ${Math.round(d / 30.4)} meses` : `em ${(d / 365.25).toFixed(1).replace('.', ',')} anos`;
function maturities() {
  const out = [];
  pos().forEach(p => {
    if (p.rf) {
      const c = rfCalc(p.rf), yrs = (new Date(p.rf.mat + 'T12:00:00') - new Date(p.rf.date + 'T12:00:00')) / (365.25 * DAY);
      out.push({p, mat:p.rf.mat, value:p.rf.applied * Math.pow(1 + c.yr, yrs) * (p.cur === 'USD' ? FX : 1)});
    } else if (p.mat) {
      const yrs = Math.max(0, (new Date(p.mat + 'T12:00:00') - NOW) / (365.25 * DAY));
      const v = /Pré|Prefixado/.test(p.ticker) ? p.qty * 1000 : valueBRL(p) * Math.pow(p.cls === 'rf_pos' ? 1 + CDI : (1 + IPCA) * 1.062, yrs);
      out.push({p, mat:p.mat, value:v});
    }
  });
  return out.filter(x => daysTo(x.mat) >= 0).sort((a, b) => a.mat.localeCompare(b.mat));
}
function realRate(p) {
  const c = rfCalc(p.rf);
  const corrected = p.rf.applied * Math.pow(1 + IPCA, c.years);
  return {nominal:c.yr, real:(1 + c.yr) / (1 + IPCA) - 1, corrected, gain:c.value - corrected, value:c.value, label:c.label};
}
function fgc() {
  const by = new Map();
  pos().filter(p => p.rf && FGC_TYPES.includes(p.rf.type) && ISS[p.rf.issuer] && ISS[p.rf.issuer].bank).forEach(p => {
    const cong = ISS[p.rf.issuer].cong;
    const g = by.get(cong) || {cong, total:0, items:[]};
    g.total += valueBRL(p); g.items.push(p); by.set(cong, g);
  });
  const groups = [...by.values()].map(g => ({...g, covered:Math.min(g.total, FGC_LIMIT), over:Math.max(0, g.total - FGC_LIMIT)})).sort((a, b) => b.total - a.total);
  const covered = groups.reduce((t, g) => t + g.covered, 0);
  const outside = pos().filter(p => (p.rf && !FGC_TYPES.includes(p.rf.type)) || /^Tesouro/.test(p.ticker));
  return {groups, covered, overCap:Math.max(0, covered - FGC_CAP), outside};
}
function issuerOf(p) {
  if (p.rf && p.rf.type === 'treasury') return 'Tesouro dos EUA';
  if (p.rf && ISS[p.rf.issuer]) return ISS[p.rf.issuer].cong;
  if (/^Tesouro/.test(p.ticker)) return 'Tesouro Nacional';
  if (p.cls === 'cripto') return 'Cripto, sem emissor';
  return (PROFILE[p.ticker] || [])[1] || 'Fundos e ETFs, vários emissores';
}
function groupBy(list, keyOf) {
  const m = new Map();
  list.forEach(p => { const k = keyOf(p); const g = m.get(k) || {k, value:0, items:[]}; g.value += valueBRL(p); g.items.push(p.ticker); m.set(k, g); });
  return [...m.values()].sort((a, b) => b.value - a.value);
}
const concRows = (groups, total, note) => groups.map(g => `<div class="conc">
    <span><b>${esc(g.k)}</b><span class="sub">${esc(g.items.slice(0, 4).join(', '))}${g.items.length > 4 ? ` e mais ${g.items.length - 4}` : ''}</span></span>
    <span class="track"><span style="width:${(g.value / groups[0].value * 100).toFixed(1)}%"></span></span>
    <span class="num r"><b>${pct(g.value / total * 100)}</b><span class="sub">${money(g.value)}</span></span>
  </div>`).join('') + (note ? `<p class="hint" style="margin:12px 0 0">${note}</p>` : '');

  <section class="card" style="margin-top:16px">

    <div class="meterbox" style="margin-bottom:16px">

    ${f.groups.length ? `<div class="tablewrap"><table style="min-width:620px"><thead><tr><th>Conglomerado</th><th class="r">Em títulos cobertos</th><th class="r">Coberto</th><th class="r">Acima do limite</th></tr></thead><tbody>
      ${f.groups.map(g => `<tr><td><span class="cname">${esc(g.cong)}</span><span class="sub">${esc([...new Set(g.items.map(p => ISS[p.rf.issuer].name))].join(' e '))} · ${esc(g.items.map(p => p.ticker).join(', '))}</span></td>
        <td class="r num">${brl.format(g.total)}</td><td class="r num">${brl.format(g.covered)}</td>
        <td class="r">${g.over ? `<span class="chip up">${brl.format(g.over)}</span>` : '<span class="chip ok">dentro</span>'}</td></tr>`).join('')}

    ${multi() && (state.owner || 'any') === 'any' ? `<p class="tipbox" style="margin:12px 0 0">O limite do FGC vale por CPF. Filtre por titular, no alto da tela, para ver a cobertura de cada pessoa.</p>` : ''}
    ${f.outside.length ? `<p class="hint" style="margin:12px 0 0">Fora do FGC: ${esc(f.outside.map(p => p.ticker).join(', '))}. Tesouro Direto tem garantia do Tesouro Nacional; debênture depende só da empresa.</p>` : ''}

function catTotals() {
  const t = {...CAT_BASE};
  let unc = 0;
  txs.forEach(x => { if (x.cat) t[x.cat] = (t[x.cat] || 0) + x.amt; else unc += x.amt; });
  return {t, unc};
}
function spendSummary() {
  const {t, unc} = catTotals();
  const spent = Object.values(t).reduce((a, b) => a + b, 0) + unc;
  const saved = INCOME - spent;
  return {t, unc, spent, saved, rate: saved / INCOME * 100};
}

function cutPlan() {
  const {t, unc, saved, rate} = spendSummary();
  const goalAmt = INCOME * state.goal / 100;
  const gap = Math.max(0, goalAmt - saved);
  const flex = CATS.filter(c => c.flex && t[c.id] > 0).map(c => ({c, cur:t[c.id], excess:Math.max(0, t[c.id] - c.avg)}));
  const sumEx = flex.reduce((s, f) => s + f.excess, 0);
  const sumFlex = flex.reduce((s, f) => s + f.cur, 0);
  flex.forEach(f => {
    if (gap <= 0) f.cut = 0;
    else if (sumEx >= gap) f.cut = f.excess * gap / sumEx;
    else f.cut = Math.min(f.cur, f.excess + (gap - sumEx) * f.cur / (sumFlex || 1));
  });
  const totalCut = flex.reduce((s, f) => s + f.cut, 0);
  const impossible = gap > sumFlex;
  return {t, unc, saved, rate, goalAmt, gap, flex, totalCut, impossible};
}

function rfCalc(f) {
  const years = Math.max(0, (new Date('2026-10-09T12:00:00') - new Date(f.date + 'T12:00:00')) / (365.25 * 864e5));
  const yr = f.idx === 'cdi' ? CDI * f.rate / 100 : f.idx === 'pre' ? f.rate / 100 : (1.045 * (1 + f.rate / 100) - 1);
  const value = f.applied * Math.pow(1 + yr, years);
  const cls = f.idx === 'cdi' ? 'rf_pos' : f.idx === 'pre' ? 'rf_pre' : 'rf_ipca';
  const rt = String(f.rate).replace('.', ',');
  const label = f.idx === 'cdi' ? `${rt}% do CDI` : f.idx === 'pre' ? `pré ${rt}% a.a.` : `IPCA + ${rt}%`;
  const src = f.idx === 'ipca' ? 'IPCA + taxa (BC)' : f.idx === 'pre' ? 'Taxa contratada' : 'Curva do CDI (BC)';
  return {value, cls, label, src, years, yr};
}

          <p class="note" style="margin:0">${ic('info')}<span>Tem Tesouro Direto? Volte e escolha "Tesouro Direto": lá você informa só a quantidade de títulos.</span></p>
        ` : `
          <div class="searchbox">${ic('search')}<input class="input" id="q" placeholder="Busque por ticker ou nome" value="${esc(m.q)}" autocomplete="off" aria-label="Buscar ${t.name}"></div>
          <div class="results">${results.map(a => `<button class="result" data-pick="${a.ticker}" aria-pressed="${m.pick && m.pick.ticker === a.ticker}"><span class="tile" style="${tint(a.cls)}">${ic(CLS[a.cls].icon)}</span><span><b>${a.ticker}</b> <span class="muted">${a.name}</span><span class="sub">${a.type} · ${a.cur === 'USD' ? usd2.format(a.price) : brl2.format(a.price)}</span></span>${a.flag ? `<span class="chip plain">${a.type}</span>` : ''}</button>`).join('') || '<p class="muted">Nada encontrado no catálogo de exemplo.</p>'}</div>

      <div class="sheet-foot"><button class="btn ghost" data-close>Cancelar</button>${t ? `<button class="btn primary" data-save ${!isRf && !m.pick ? 'disabled' : ''}>${ic('plus')}Adicionar à carteira</button>` : ''}</div>

    if (iq && m.focusIq) { iq.focus(); iq.setSelectionRange(iq.value.length, iq.value.length); }

    const el = e.target.closest('[data-close],[data-type],[data-back],[data-pick],[data-save],[data-issuer]');
    if (!el) { if (e.target.hasAttribute('data-close-bg')) close(); return; }
    m.focusQ = false; m.focusIq = false;
    if (el.dataset.issuer) { m.rf.issuer = el.dataset.issuer; m.iq = ''; autoName(); return draw(); }
    if (el.hasAttribute('data-close')) return close();
    if (el.dataset.type) { m.type = el.dataset.type; m.pick = null; m.q = ''; m.focusQ = true; return draw(); }
    if (el.hasAttribute('data-back')) { m.type = null; m.pick = null; return draw(); }
    if (el.dataset.pick) { m.pick = CATALOG.find(a => a.ticker === el.dataset.pick); m.qty = null; m.pickCls = null; return draw(); }
    if (el.hasAttribute('data-save')) save();
  };
  root.oninput = e => {
    const el = e.target;
    if (el.id === 'q') { m.q = el.value; m.focusQ = true; return draw(); }
    if (el.id === 'rf-iq') { m.iq = el.value; m.focusIq = true; return draw(); }
    if (el.id === 'add-owner') { m.owner = el.value; return; }
    if (el.id === 'add-qty') { m.qty = Number(el.value) || 0; const p = m.pick; root.querySelector('#pv').textContent = brl.format(m.qty * p.price * (p.cur === 'USD' ? FX : 1)); return; }
    if (el.id === 'add-cls') { m.pickCls = el.value; root.querySelector('#preview').innerHTML = rvPreview(); return; }
    if (el.dataset.rf) {
      const k = el.dataset.rf;
      m.rf[k] = ['rate', 'applied'].includes(k) ? (Number(el.value) || 0) : el.value;
      if (k === 'name') m.nameTouched = true;
      if (k === 'type') {
        const wantBank = el.value !== 'deb';
        if (ISS[m.rf.issuer].bank !== wantBank) m.rf.issuer = wantBank ? 'xp' : 'eletrobras';
        if (!wantBank && m.rf.idx === 'cdi') { m.rf.idx = 'ipca'; m.rf.rate = 6.2; }
        autoName(); return draw();
      }
      if (k === 'idx') { m.rf.rate = el.value === 'cdi' ? 105 : el.value === 'pre' ? 12.5 : 6.2; return draw(); }
      root.querySelector('#preview').innerHTML = rfPreview();
    }
  };
  const save = () => {
    if (TYPEMAP[m.type].mode !== 'rf') {
      if (!m.pick) return;
      const p = m.pick, qty = m.qty ?? (p.cls === 'cripto' ? 0.1 : p.type === 'Tesouro' ? 1 : 100), c = m.pickCls || p.cls;
      positions.push({id:nextId++, ticker:p.ticker, name:p.name, cls:c, kind:'rv', qty, price:p.price, cur:p.cur, src:p.src, usdExp:p.usdExp, flag:p.flag, mat:p.mat, owner:m.owner});
      toast(`${p.ticker} adicionado em ${CLS[c].name}`);
    } else {
      const r = rfCalc(m.rf);
      const np = {id:nextId++, ticker:m.rf.name || 'Título', kind:'rf', cur:'BRL', owner:m.owner, rf:{type:m.rf.type, issuer:m.rf.issuer, idx:m.rf.idx, rate:m.rf.rate, applied:m.rf.applied, date:m.rf.date, mat:m.rf.mat}};
      positions.push(Object.assign(np, rfFields(np)));
      toast(`${m.rf.name}: ${brl.format(r.value)} hoje, em ${CLS[r.cls].name}`);
    }
    close(); render();
  };
  m.focusQ = !!m.type;
  draw();
}

function renderOnb() {
  const root = document.getElementById('onb-root');
  if (!state.auth || !state.onb.open) { root.innerHTML = ''; document.body.style.overflow = state.auth ? '' : 'hidden'; return; }
  const sc = root.querySelector('.onb')?.scrollTop || 0;
  const keep = {};
  ['ocid', 'ocsec', 'oitems'].forEach(k => { const el = document.getElementById(k); if (el) keep[k] = el.value; });
  root.innerHTML = onbHTML();
  Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; });
  const o = root.querySelector('.onb'); if (o && state.onb.keepScroll) o.scrollTop = sc;
  state.onb.keepScroll = true;
  document.body.style.overflow = 'hidden';
}

function onbAction(a) {
  const o = state.onb;
  const step = n => { o.step = n; o.keepScroll = false; render(); };
  if (a === 'next') { if (o.step === 1) o.skipped.assets = false; if (o.step === 2) o.skipped.pluggy = false; return step(o.step + 1); }
  if (a === 'back') return step(Math.max(0, o.step - 1));
  if (a === 'skip') { if (o.step === 1) o.skipped.assets = true; if (o.step === 2) o.skipped.pluggy = true; return step(o.step + 1); }
  if (a === 'goto-1') return step(1);
  if (a === 'goto-2') return step(2);
  if (a === 'close' || a === 'finish') { o.open = false; return go(positions.length || !hasSpend() ? 'visao' : 'gastos'); }
  if (a === 'finish-meta') { o.open = false; return go('meta'); }
  if (a === 'finish-premium') { o.open = false; return act('cfg', 'plano'); }
  if (a === 'restart') { positions = []; state.sample = false; state.pluggy = 'idle'; state.imported = null; o.open = true; o.skipped = {}; return step(0); }
  if (a === 'sample') { positions = SAMPLE.map(p => ({...p})); state.sample = true; o.open = false; toast('Dados de exemplo carregados'); return go('visao'); }
  if (a === 'fill') { document.getElementById('ocid').value = '3f9a1c2e-7b4d-4e21-9a0c-5d2b8e6f1a37'; document.getElementById('ocsec').value = 'exemplo-secreto'; document.getElementById('oitems').value = '8b2c4f10-…, 41de9a77-…'; }
}

function toast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast" role="status">${ic('check')}${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}

const tipEl = document.getElementById('tip');
function tipHTML(el) {
  const d = el.dataset;
  if (d.tip) {
    const {total, rows} = classRows();
    const r = rows.find(x => x.cls === d.tip);
    const c = CLS[d.tip];
    const targetVal = r.target / 100 * total;
    const lines = [];
    if (d.tipKind !== 'meta') lines.push(['Atual', `${pct(r.share)} · ${money(r.value)}`]);
    if (d.tipKind !== 'atual') lines.push(['Meta', `${pct(r.target, 0)} · ${money(targetVal)}`]);
    if (d.tipKind === 'atual') lines.push(['Meta', pct(r.target, 0)]);
    if (d.tipKind === 'meta') lines.push(['Atual', pct(r.share)]);
    const diff = targetVal - r.value;
    const s = Math.abs(r.dev) <= state.tol ? 'Na faixa de tolerância' : diff > 0 ? `Faltam ${money(diff)} para a meta` : `${money(-diff)} acima da meta`;
    return `<div class="t"><i style="background:var(--c-${c.id})"></i>${c.name}</div>${lines.map(([a, b]) => `<div class="l"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="l"><span>Desvio</span><b>${pp(r.dev)}</b></div><div class="s">${s}</div>`;
  }
  if (d.tipAsset) {
    const {total, groups} = assetGroups(state.cls);
    const g = groups.find(x => x.ticker === d.tipAsset);
    if (!g) return '';
    const diff = g.target / 100 * total - g.value;
    return `<div class="t"><i style="background:var(--c-${state.cls})"></i>${esc(g.ticker)}</div><div class="l"><span>Na classe</span><b>${pct(g.share)} · ${money(g.value)}</b></div><div class="l"><span>Meta</span><b>${pct(g.target)}</b></div><div class="s">${Math.abs(g.dev) <= state.tol ? 'Na faixa de tolerância' : diff > 0 ? `Faltam ${money(diff)}` : `${money(-diff)} acima`}</div>`;
  }
  if (d.tipCat) {
    const {t, unc} = catTotals();
    const c = CATMAP[d.tipCat];
    const v = c ? t[c.id] : unc;
    return `<div class="t">${c ? c.name : 'Sem categoria'}</div><div class="l"><span>Setembro</span><b>${brl.format(v)}</b></div>${c && c.avg ? `<div class="l"><span>Sua média</span><b>${brl.format(c.avg)}</b></div><div class="s">${v > c.avg ? `${brl.format(v - c.avg)} acima da média` : `${brl.format(c.avg - v)} abaixo da média`}</div>` : ''}<div class="l"><span>Da renda</span><b>${pct(v / INCOME * 100)}</b></div>`;
  }
  return '';
}
function showTip(el, x, y) {
  const html = tipHTML(el);
  if (!html) return hideTip();
  tipEl.innerHTML = html; tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = x + 14, top = y + 16;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top + h > innerHeight - 8) top = y - h - 12;
  tipEl.style.left = Math.max(8, left) + 'px'; tipEl.style.top = Math.max(8, top) + 'px';
}
function hideTip() { tipEl.hidden = true; }
const TIP_SEL = '[data-tip],[data-tip-asset],[data-tip-cat]';
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest(TIP_SEL); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('pointerleave', hideTip);
document.addEventListener('scroll', hideTip, true);

const ALIAS = {conexoes:['config', 'bancos'], planos:['config', 'plano'], whatsapp:['config', 'whatsapp'], agenda:['config', 'agenda']};
function go(screen) {
  if (ALIAS[screen]) { state.cfg = ALIAS[screen][1]; screen = ALIAS[screen][0]; }
  state.screen = screen;
  try { history.replaceState(null, '', '#' + screen); } catch (e) {}
  hideTip(); render(); window.scrollTo(0, 0);
}

function render() {
  const a = document.activeElement, id = a && a.id;
  let sel = null; try { sel = a.selectionStart; } catch (e) {}
  renderNav();
  document.getElementById('view').innerHTML = gate(state.screen) || (screens[state.screen] || screens.visao)();
  const view = document.getElementById('view'), page = document.createElement('div');
  page.className = 'page';
  [...view.children].forEach(ch => { if (!ch.classList.contains('head')) page.appendChild(ch); });
  view.appendChild(page);
  const head = view.querySelector('.head');
  if (head && state.user) head.insertAdjacentHTML('beforeend', userMenu());
  document.querySelectorAll('[data-autoscroll]').forEach(el => { el.scrollTop = el.scrollHeight; });
  const navKey = state.screen === 'classe' ? 'visao' : state.screen;
  document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.go === navKey ? 'page' : 'false'));
  const u = txs.filter(t => !t.cat).length;
  const c = document.getElementById('unc-count'); c.textContent = u || ''; c.hidden = !u;
  if (id) { const el = document.getElementById(id); if (el && el.closest('#view')) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  renderLogin();
  renderOnb();
}

document.addEventListener('click', e => {
  if (e.target.closest('#modal-root')) return;
  if (state.umenu && !e.target.closest('.usermenu > button')) { state.umenu = false; if (!e.target.closest('[data-act],[data-go],[data-logout]')) return render(); }
  const el = e.target.closest('[data-act],[data-login],[data-logout],[data-export],[data-onb],[data-add-type],[data-go],[data-set],[data-open-class],[data-step],[data-tol],[data-add],[data-del],[data-aporte-quick],[data-flex],[data-fix],[data-pluggy-demo],[data-pluggy-reset]');
  if (!el) return;
  const d = el.dataset;
  if (d.act) return act(d.act, d.arg, el);
  if (d.login) { state.auth = true; state.user = {name:'Lucas', provider:d.login}; toast(`Você entrou com ${d.login}`); return render(); }
  if (el.hasAttribute('data-logout')) { state.auth = false; hideTip(); toast('Você saiu da sua conta'); return render(); }
  if (d.export) { const f = d.export === 'ativos' ? 'vera-carteira.xlsx' : 'vera-transacoes-2026-09.xlsx'; return toast(`${f} gerada (no protótipo o download fica desativado)`); }
  if (d.onb) return onbAction(d.onb);
  if (d.addType) return openAdd(null, {type:d.addType});
  if (d.go) return go(d.go);
  if (d.set) { state[d.set] = d.val; return render(); }
  if (d.openClass) { state.cls = d.openClass; return go('classe'); }
  if (d.step) { classTargets[d.step] = Math.max(0, Math.min(100, (classTargets[d.step] || 0) + Number(d.d))); return render(); }
  if (d.tol) { state.tol = Math.max(0, Math.min(20, state.tol + Number(d.tol))); return render(); }
  if (d.add !== undefined) { hideTip(); return openAdd(d.add || null); }
  if (d.del) { const p = positions.find(x => x.id === Number(d.del)); positions = positions.filter(x => x.id !== Number(d.del)); toast(`${p.ticker} removido`); return render(); }
  if (d.aporteQuick) { state.aporte = Number(d.aporteQuick); return render(); }
  if (d.flex) { CATMAP[d.flex].flex = !CATMAP[d.flex].flex; return render(); }
  if (d.fix) {
    const t = txs.find(x => x.id === Number(d.fix));
    const cat = document.getElementById('fx-' + t.id).value;
    if (!cat) return toast('Escolha uma categoria primeiro');
    const always = document.getElementById('rule-' + t.id).checked;
    const who = t.m.split('·')[1]?.trim();
    let n = 0;
    txs.forEach(x => { if (!x.cat && (x.id === t.id || (always && who && x.m.includes(who)))) { x.cat = cat; x.how = always ? 'sua regra' : 'você'; n++; } });
    toast(always ? `Regra criada: ${who} → ${CATMAP[cat].name} (${n} ${n > 1 ? 'transações' : 'transação'})` : `Categorizada como ${CATMAP[cat].name}`);
    return render();
  }
  if (el.hasAttribute('data-pluggy-demo')) { document.getElementById('cid').value = '3f9a1c2e-7b4d-4e21-9a0c-5d2b8e6f1a37'; document.getElementById('csec').value = 'exemplo-secreto'; document.getElementById('items').value = '8b2c4f10-…, 41de9a77-…'; return; }
  if (el.hasAttribute('data-pluggy-reset')) { state.pluggy = 'idle'; return render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.umenu) { state.umenu = false; render(); document.querySelector('.usermenu > button')?.focus(); return; }
  if (e.key === 'Escape' && document.getElementById('modal-root').innerHTML) { document.getElementById('modal-root').innerHTML = ''; document.getElementById('modal-root').onclick = null; return; }
  const row = e.target.closest && e.target.closest('[data-open-class]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); state.cls = row.dataset.openClass; go('classe'); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('#modal-root')) return;
  const d = el.dataset;
  if (d.classTarget) { classTargets[d.classTarget] = Math.max(0, Math.min(100, Number(el.value) || 0)); return render(); }
  if (d.assetTarget) {
    const {groups} = assetGroups(state.cls);
    if (!assetTargets[state.cls]) assetTargets[state.cls] = assetTargetsFor(state.cls, groups.map(g => g.ticker));
    assetTargets[state.cls][d.assetTarget] = Math.max(0, Math.min(100, Number(el.value) || 0));
    return render();
  }
  if (el.hasAttribute('data-tol-input')) { state.tol = Math.max(0, Math.min(20, Number(el.value) || 0)); return render(); }
  if (el.hasAttribute('data-aporte')) { state.aporte = Number(el.value) || 0; return render(); }
  if (el.hasAttribute('data-goal')) { state.goal = Number(el.value); return render(); }
  if (el.id === 'wa-phone') { state.wa.phone = el.value; return; }
  if (el.id === 'wa-code') { state.wa.code = el.value; return; }
  if (el.id === 'inv-email') { state.invite.email = el.value; return; }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('#modal-root')) return;
  if (el.dataset.reclass) { const p = positions.find(x => x.id === Number(el.dataset.reclass)); p.cls = el.value; toast(`${p.ticker} agora em ${CLS[p.cls].name}`); return render(); }
  if (el.dataset.role) {
    const m = state.members.find(x => x.id === el.dataset.role);
    m.role = el.value; toast(`${m.name}: ${el.options[el.selectedIndex].text}`); return render();
  }
  if (el.id === 'inv-role') { state.invite.role = el.value; return; }
  if (el.dataset.owner) { const p = positions.find(x => x.id === Number(el.dataset.owner)); p.owner = el.value; toast(`${p.ticker}: titular ${ownerLabel(el.value)}`); return render(); }
  if (el.dataset.qty) { const p = positions.find(x => x.id === Number(el.dataset.qty)); p.qty = Math.max(0, Number(el.value) || 0); return render(); }
  if (el.dataset.done) { state.done[el.dataset.done] = el.checked; return render(); }
  if (el.id === 'wa-consent') { state.wa.consent = el.checked; return render(); }

/* acesso: 'on' liberado, 'locked' (hospedada, no Free) ou 'hidden' (auto-hospedada, sem a chave) */
function feat(k) {
  if (state.selfhost) return k === 'wa' ? (state.keys.wa && state.keys.ia ? 'on' : 'hidden') : state.keys[k] ? 'on' : 'hidden';
  return state.plan === 'premium' ? 'on' : 'locked';
}
const gcalOn = () => state.gcal.on && feat('gcal') === 'on';
const list = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
const lower = s => s.charAt(0).toLowerCase() + s.slice(1);

/* cota do mês: o teto em reais fica no servidor; a pessoa vê só a porcentagem */
const usage = () => Math.min(100, Math.round(Object.values(state.useBy).reduce((a, b) => a + b, 0)));
const paused = () => !state.selfhost && usage() >= 100;
function consume(kind, n) {
  if (state.selfhost) return true;
  if (paused()) { toast(`Cota do mês esgotada. Volta em ${RESET}`); return false; }
  const before = usage();
  state.useBy[kind] += n;
  const after = usage();
  if (after >= 100) toast(`Cota esgotada: explicações e WhatsApp pausados até ${RESET}`);
  else if (before < WARN_AT && after >= WARN_AT) toast(`Você já usou ${after}% da cota do mês`);
  return true;
}
function simUsage(p) { state.useBy = {explicacoes:p * .6, whatsapp:p * .4}; }
function quotaBanner() {
  const u = usage();
  if (state.selfhost || state.plan !== 'premium' || u < WARN_AT) return '';
  if (u >= 100) return `<div class="banner crit"><b>Pausado até ${RESET}</b><span>A cota do mês acabou. Explicações e WhatsApp voltam na virada do mês, sem cobrança extra; o resto da Vera segue normal. <button class="linkbtn" data-act="sim" data-arg="0">Simular a virada</button></span></div>`;
  return `<div class="banner warn"><b>${u}% da cota de outubro usada</b><span>Em 100%, explicações e WhatsApp pausam até ${RESET}, sem cobrança extra.</span></div>`;
}
function meter(full) {
  const u = usage(), tone = u >= 100 ? 'crit' : u >= WARN_AT ? 'warn' : 'brand';
  return `<div class="meterbox">
    <div class="row between"><span class="label">Cota de outubro</span><span class="num"><b>${u}%</b> <span class="muted">usada</span></span></div>
    <div class="meter ${tone}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${u}" aria-label="Cota de uso do mês"><span style="width:${u}%"></span></div>
    <div class="row between muted" style="font-size:12.5px"><span>Renova em ${RESET}</span><span>${tone === 'brand' ? `Sobram ${100 - u}%` : tone === 'warn' ? 'Perto do limite' : 'Pausado até a renovação'}</span></div>
    ${full ? `<p class="hint" style="margin:0">Explicações ${Math.round(state.useBy.explicacoes)}% · WhatsApp ${Math.round(state.useBy.whatsapp)}%. Cada explicação gerada e cada mensagem no WhatsApp usam um pouco; a cota cobre o uso normal de um mês.</p>
    <div class="row" style="font-size:12.5px"><span class="chip plain">protótipo</span><span class="muted">Simular uso:</span><div class="seg" role="group" aria-label="Simular uso da cota">${[0, 34, 85, 100].map(v => `<button data-act="sim" data-arg="${v}" aria-pressed="${u === v}">${v}%</button>`).join('')}</div></div>` : ''}
    ${quotaBanner()}
  </div>`;
}

/* explicações em texto, montadas a partir dos mesmos números do app (no produto, escritas por um modelo de linguagem) */
function textMes() {
  const {t, unc, spent, saved, rate} = spendSummary();
  const ups = CATS.filter(c => c.avg && t[c.id] > c.avg * 1.1).map(c => ({c, p:Math.round((t[c.id] / c.avg - 1) * 100)})).sort((a, b) => b.p - a.p);
  const fixedCats = CATS.filter(c => !c.flex && t[c.id] > 0);
  const fixed = fixedCats.reduce((s, c) => s + t[c.id], 0);
  const diff = Math.round(rate - state.goal);
  return [
    `Entraram ${brl.format(INCOME)} e saíram ${brl.format(spent)}. Você guardou <b>${brl.format(saved)}</b>, ${pct(rate, 0)} da renda: ${diff >= 0 ? `${diff ? diff + ' pontos acima' : 'exatamente'} da meta de ${state.goal}%.` : `${-diff} ${-diff > 1 ? 'pontos' : 'ponto'} abaixo da meta de ${state.goal}%.`}`,
    ups.length ? `A diferença veio dos gastos flexíveis: ${list(ups.slice(0, 3).map(u => `${lower(u.c.name)} (+${u.p}% sobre a sua média)`))}.` : 'Os gastos flexíveis ficaram perto da sua média.',
    fixedCats.length ? `Os fixos (${list(fixedCats.map(c => lower(c.name)))}) somam ${brl.format(fixed)}, ${pct(fixed / INCOME * 100, 0)} da renda, sem mudança.` : '',
    unc > 0 ? `${brl.format(unc)} ficaram sem categoria, quase tudo Pix para pessoa física. Se forem transferências entre contas suas, o mês foi melhor do que parece.` : ''
  ].filter(Boolean);
}
function textCortes() {
  const c = cutPlan();
  if (c.gap <= 0) return [`Você já guarda mais que a meta de ${state.goal}%: sobram <b>${brl.format(c.saved - c.goalAmt)}</b> acima dela. Não precisa cortar nada; esse dinheiro pode ir para o aporte.`];
  const top = c.flex.filter(f => f.cut >= 1).sort((a, b) => b.cut - a.cut);
  return [
    `Para guardar ${state.goal}% da renda, faltam <b>${brl.format(c.gap)}</b> por mês.`,
    c.impossible ? 'É mais do que todos os gastos flexíveis somados: só cortar não resolve. Seria preciso rever um gasto fixo, a renda ou a meta.' : `O caminho mais leve é voltar à sua própria média onde o gasto subiu: ${list(top.map(f => `${lower(f.c.name)} de ${brl.format(f.cur)} para ${brl.format(f.cur - f.cut)}`))}.`,
    !c.impossible && top[0] ? `Se for escolher uma só, comece por ${lower(top[0].c.name)}: ela cobre ${Math.round(top[0].cut / c.gap * 100)}% do que falta.` : ''
  ].filter(Boolean);
}
function textCarteira(amount = state.aporte || 10000) {
  const {total, rows} = classRows();
  const usdE = positions.filter(p => p.cur === 'USD' || p.usdExp).reduce((s, p) => s + valueBRL(p), 0);
  const below = rows.filter(r => r.dev < -state.tol).sort((a, b) => a.dev - b.dev);
  const above = rows.filter(r => r.dev > state.tol).sort((a, b) => b.dev - a.dev);
  const alloc = allocate(amount, rows.map(r => ({current:r.value, target:r.target})));
  const top = rows.map((r, i) => ({r, a:alloc[i]})).filter(x => x.a >= 1).sort((a, b) => b.a - a.a).slice(0, 3);
  const out = below.length + above.length;
  return [
    `O patrimônio soma <b>${money(total)}</b>, com ${pct(total ? usdE / total * 100 : 0)} exposto ao dólar. ${out ? `${out} de ${rows.length} classes estão fora da faixa de ±${state.tol} pp.` : `Todas as classes estão dentro da faixa de ±${state.tol} pp.`}`,
    below.length ? `Abaixo da meta: ${list(below.map(r => `${lower(CLS[r.cls].name)} (${pct(r.share)} contra ${pct(r.target, 0)})`))}.` : '',
    above.length ? `Acima: ${list(above.map(r => `${lower(CLS[r.cls].name)} (${pct(r.share)} contra ${pct(r.target, 0)})`))}. Não precisa vender; basta não aportar nelas por um tempo.` : '',
    top.length ? `Com ${brl.format(amount)} de aporte, a sugestão é ${list(top.map(x => `${brl.format(x.a)} em ${lower(CLS[x.r.cls].name)}`))}.` : ''
  ].filter(Boolean);
}

/* respostas no WhatsApp */
const strip = html => html.replace(/<[^>]+>/g, '');
const NO_SPEND = 'Ainda não vejo gastos seus. Conecte os bancos em Configurações › Bancos ou importe um extrato.';
const NO_POS = 'Sua carteira ainda está vazia. Cadastre os ativos em Meus ativos.';
function waReply(q) {
  const s = q.toLowerCase();
  const amt = (() => { const m = s.match(/(\d+(?:[.,]\d+)?)\s*(mil|k)?/); return m ? Number(m[1].replace('.', '').replace(',', '.')) * (m[2] ? 1000 : 1) : 0; })();
  if (/\bpix\b|transfer|pagar|pague|boleto/.test(s)) return 'A Vera não faz Pix, pagamentos nem transferências: ela só lê seus dados. Use o app do seu banco.';
  if (/(meus|quais|listar?)\s+lembretes/.test(s)) return state.reminders.length ? 'Seus lembretes:\n' + state.reminders.map(r => `• ${r.t}, ${r.when}`).join('\n') : 'Você não tem lembretes. É só pedir: "me lembra de aportar todo dia 5".';
  if (/lembr/.test(s)) {
    const day = (s.match(/dia\s*(\d{1,2})/) || [])[1];
    const what = /aport/.test(s) ? 'Fazer o aporte do mês' : /fatura/.test(s) ? 'Pagar a fatura do cartão' : (q.replace(/.*?lembr\w*\s*(de\s+|que\s+)?/i, '').replace(/\s*(todo\s+)?dia\s*\d+.*/i, '').trim() || 'Lembrete');
    const r = {t:what.charAt(0).toUpperCase() + what.slice(1), when:day ? `todo dia ${day}, 09:00` : 'amanhã, 09:00'};
    state.reminders.push(r);
    return `Lembrete criado: ${lower(r.t)}, ${r.when.replace(', ', ' às ')}. Para ver ou apagar, mande "meus lembretes".`;
  }
  if (/reuni|agenda|compromisso|marc[ae]/.test(s)) {
    if (!gcalOn()) return 'Para criar e listar reuniões, conecte o Google Agenda em Configurações › Google Agenda. A permissão é pedida só para isso.';
    if (/marc|cri|agend|nova/.test(s) && !/quais|minhas|pr[oó]xim|lista/.test(s)) {
      const h = (s.match(/(\d{1,2})\s*(h|:)/) || [])[1];
      const ev = {d:/amanh/.test(s) ? 'sáb 10/10' : 'sex 16/10', h:h ? h.padStart(2, '0') + ':00' : '15:00', t:/contador/.test(s) ? 'Reunião com o contador' : /gerente|banco/.test(s) ? 'Reunião com o gerente do banco' : 'Reunião', mine:true};
      state.events.push(ev);
      return `Reunião criada no Google Agenda: ${lower(ev.t)}, ${ev.d} às ${ev.h}.`;
    }
    return 'Seus próximos compromissos:\n' + state.events.map(e => `• ${e.d}, ${e.h}: ${e.t}`).join('\n');
  }
  if (/deliv|ifood|restaur|comida/.test(s)) {
    if (!hasSpend()) return NO_SPEND;
    const v = spendSummary().t.delivery, c = CATMAP.delivery;
    return `Em setembro foram ${brl.format(v)} em delivery e restaurantes, ${v > c.avg ? `${Math.round((v / c.avg - 1) * 100)}% acima` : 'abaixo'} da sua média de ${brl.format(c.avg)}.`;
  }
  if (/cort|econom|guard|sobra/.test(s)) return hasSpend() ? strip(textCortes().join(' ')) : NO_SPEND;
  if (/aport|invest|onde coloc/.test(s)) return positions.length ? strip(textCarteira(amt >= 100 ? amt : undefined).slice(-1)[0]) : NO_POS;
  if (/carteira|patrim|distribu|d[oó]lar/.test(s)) return positions.length ? strip(textCarteira().slice(0, 3).join(' ')) : NO_POS;
  if (/gast|m[eê]s|setembro/.test(s)) return hasSpend() ? strip(textMes().slice(0, 2).join(' ')) : NO_SPEND;
  if (/^(oi|ol[aá]|bom dia|boa tarde|boa noite)\b/.test(s)) return 'Oi. Pergunte sobre a carteira ou os gastos, peça para marcar uma reunião ou criar um lembrete.';
  return 'No protótipo, a Vera responde só a algumas mensagens. Tente "quanto gastei com delivery?" ou "me lembra de aportar todo dia 5".';
}
function waSend(text) {
  text = (text || '').trim();
  if (!text || !consume('whatsapp', 1)) return render();
  state.wa.msgs.push({who:'me', text});
  render();
  setTimeout(() => { state.wa.msgs.push({who:'vera', text:waReply(text)}); render(); }, 650);
}
const bubble = m => `<div class="bubble ${m.who}">${esc(m.text).replace(/\n/g, '<br>')}</div>`;

function payload() {
  const {t, unc} = spendSummary();
  const {rows} = classRows();
  return JSON.stringify({
    mes:'2026-09', renda:INCOME, meta_economia_pct:state.goal,
    gastos_por_categoria: hasSpend() ? Object.fromEntries(CATS.filter(c => t[c.id] > 0).map(c => [c.id, {total:Math.round(t[c.id]), media_3m:c.avg, tipo:c.flex ? 'flexivel' : 'fixo'}])) : 'sem dados',
    sem_categoria: hasSpend() ? Math.round(unc) : undefined,
    carteira_pct: positions.length ? Object.fromEntries(rows.map(r => [r.cls, {atual:Math.round(r.share * 10) / 10, meta:r.target}])) : 'sem dados',
    aporte_planejado: state.aporte
  }, null, 2);
}

function sheet(html, onAction, size = 'narrow') {
  const root = document.getElementById('modal-root');
  let open = true, drawn = false;
  const draw = () => { if (!open || (drawn && !root.innerHTML)) return; drawn = true; root.innerHTML = `<div class="modal" data-close-bg><div class="sheet ${size}" role="dialog" aria-modal="true" aria-labelledby="m-title">${html()}</div></div>`; };
  const close = () => { open = false; root.innerHTML = ''; root.onclick = null; root.oninput = null; };
  const h = {close, redraw:draw};
  root.onclick = e => {
    const el = e.target.closest('[data-close],[data-m]');
    if (!el) { if (e.target.hasAttribute('data-close-bg')) close(); return; }
    if (el.hasAttribute('data-close')) return close();
    if (!el.disabled) onAction(el.dataset.m, el, h);
  };
  root.oninput = e => onAction('input', e.target, h);
  draw();
  const first = root.querySelector('input:not([readonly]),button.primary'); if (first) first.focus();
  return h;
}
const mHead = (t, d = '') => `<div class="sheet-head"><div><h3 id="m-title">${t}</h3>${d ? `<p class="muted" style="margin:4px 0 0;font-size:13px">${d}</p>` : ''}</div><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>`;
function fakeQR() {
  const n = 25, cells = [];
  let x = 7;
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const F = [[0, 0], [0, n - 7], [n - 7, 0]];
  const inF = (r, c) => F.find(([a, b]) => r >= a && r < a + 7 && c >= b && c < b + 7);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const f = inF(r, c);
    const on = f ? (() => { const i = r - f[0], j = c - f[1]; return i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4); })() : rnd() > .52;
    if (on) cells.push(`<rect x="${c}" y="${r}" width="1" height="1"/>`);
  }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix de exemplo"><g fill="#2a1822">${cells.join('')}</g></svg>`;
}

    <div class="sheet-foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" data-m="pay">${pix ? 'Já paguei (simular confirmação)' : `Assinar por ${PRICE}/mês`}</button></div>`;
  };
  sheet(html, (a, el, h) => {
    if (a === 'method') { m.method = el.dataset.arg; return h.redraw(); }
    if (a === 'copy') return toast('Código Pix copiado');
    if (a === 'pay') {
      m.step = 'wait'; h.redraw();
      setTimeout(() => { m.step = 'done'; state.plan = 'premium'; state.sub = {method:m.method, status:'active'}; simUsage(0); render(); h.redraw(); }, 1100);
      return;
    }
    if (a === 'goto') { h.close(); const g = el.dataset.arg; return g.startsWith('cfg:') ? act('cfg', g.slice(4)) : go(g); }
  }, 'mid');
}
function confirmSheet({t, body, ok, onOk}) {
  sheet(() => mHead(t) + `<div class="sheet-single">${body}</div><div class="sheet-foot"><button class="btn ghost" data-close>Voltar</button><button class="btn danger solid" data-m="ok">${ok}</button></div>`, (a, el, h) => { if (a === 'ok') { h.close(); onOk(); } });
}
function openGcal() {
  if (feat('gcal') !== 'on') return act('cfg', feat('gcal') === 'hidden' ? 'integracoes' : 'plano');
  sheet(() => mHead('Conectar o Google Agenda', 'Você vai para o Google autorizar. No login a Vera só recebeu nome e e-mail; a agenda é pedida agora, à parte.') + `<div class="sheet-single" style="display:grid;gap:4px">
      ${setrow('calendar', 'Permissão pedida: ver e editar eventos', 'Para criar as reuniões que você pedir no WhatsApp e listar seus próximos compromissos.')}
      ${setrow('x', 'O que a Vera não acessa', 'E-mails, contatos e arquivos. Você pode revogar o acesso aqui ou na sua Conta do Google.')}
      <p class="tipbox" style="margin:8px 0 0">Protótipo: no produto, aqui você seria levada à tela de autorização do próprio Google. Nenhuma conta é conectada de verdade.</p>
    </div><div class="sheet-foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" data-m="allow">Simular autorização</button></div>`,
  (a, el, h) => { if (a === 'allow') { h.close(); state.gcal.on = true; toast('Google Agenda conectado'); render(); } });
}
function openPayload() {
  sheet(() => mHead('O que é enviado', 'Montado agora com os seus dados. Só números agregados, sem nomes.') + `<div class="sheet-single"><pre class="payload">${esc(payload())}</pre></div><div class="sheet-foot"><button class="btn primary" data-close>Entendi</button></div>`, () => {});
}
const KEYS = {
  ia:{t:'Modelo de linguagem', fields:[['URL da API', 'https://api.openai.com/v1'], ['Chave', 'sk-exemplo-••••••••'], ['Modelo', 'gpt-4o-mini']], note:'Qualquer provedor compatível com a API da OpenAI, inclusive um modelo local.'},
  wa:{t:'WhatsApp Cloud API', fields:[['Token de acesso', 'EAAG-exemplo-••••'], ['ID do número', '109876543210'], ['Token de verificação do webhook', 'vera-webhook-exemplo']], note:'Crie um app no Meta for Developers e aponte o webhook para https://sua-vera.exemplo/api/whatsapp.'},
  gcal:{t:'Google Agenda (OAuth)', fields:[['Client ID', '1234-exemplo.apps.googleusercontent.com'], ['Client Secret', 'GOCSPX-exemplo-••••']], note:'No Google Cloud, crie um cliente OAuth com o redirecionamento https://sua-vera.exemplo/api/google/callback.'}
};
function openKey(k) {
  const K = KEYS[k];
  let filled = false;
  sheet(() => mHead(K.t, K.note + ' As chaves ficam cifradas no seu servidor.') + `<div class="sheet-single" style="display:grid;gap:12px">
      ${K.fields.map(([l, ex], i) => `<div class="field"><label for="k-${i}">${l}</label><input class="input" id="k-${i}" autocomplete="off" ${/chave|token|secret/i.test(l) ? 'type="password"' : ''} value="${filled ? esc(ex) : ''}"></div>`).join('')}
    </div><div class="sheet-foot"><button class="btn ghost" data-m="fill">Preencher exemplo</button><button class="btn primary" data-m="save">Salvar e testar</button></div>`,
  (a, el, h) => {
    if (a === 'fill') { filled = true; return h.redraw(); }
    if (a === 'save') {
      if ([...document.querySelectorAll('#modal-root .sheet-single input')].some(i => !i.value)) return toast('Preencha todos os campos');
      h.close(); state.keys[k] = true; toast(`${K.t}: conectado`); render();
    }
  });
}

/* ---------- ações ---------- */
function act(a, arg) {
  const w = state.wa;
  switch (a) {
    case 'umenu': state.umenu = !state.umenu; render(); if (state.umenu) document.querySelector('.umenu .mi')?.focus(); return;
    case 'atab': state.atab = arg; return go('ativos');
    case 'owner': state.owner = arg; return render();
    case 'inv-fill': state.invite = {email:'ana.exemplo@gmail.com', role:'editor'}; return render();
    case 'inv-resend': return toast(`Convite reenviado para ${state.members.find(m => m.id === arg).email}`);
    case 'inv-accept': { const m = state.members.find(x => x.id === arg); m.status = 'ativo'; toast(`${m.name} entrou na conta`); return render(); }
    case 'mem-remove': {
      const m = state.members.find(x => x.id === arg);
      return confirmSheet({t:`Remover ${m.name}?`, ok:'Remover', body:`<p style="margin:0">${esc(m.name)} perde o acesso à conta. ${m.status === 'ativo' ? 'Os ativos com titular ' + esc(m.name) + ' passam para Conta toda.' : 'O link do convite deixa de funcionar.'}</p>`,
        onOk:() => { state.members = state.members.filter(x => x.id !== arg); positions.forEach(p => { if (p.owner === arg) p.owner = 'all'; }); if (state.owner === arg) state.owner = 'any'; toast(`Acesso de ${m.name} removido`); render(); }});
    }
    case 'mem-leave':
      return confirmSheet({t:'Sair da conta?', ok:'Sair da conta', body:'<p style="margin:0">Você perde o acesso a esta carteira e a estes gastos. Para voltar, alguém da conta precisa te convidar de novo.</p>',
        onOk:() => { state.auth = false; toast('Você saiu da conta (protótipo)'); render(); }});
    case 'realloc': state.aporte = Math.round(Number(arg) / 100) * 100; toast(`${brl.format(state.aporte)} para aportar`); return go('aporte');
    case 'file-del': state.imported = null; toast('Extrato removido'); return render();
    case 'checkout': return openCheckout();
    case 'cfg': state.cfg = arg; return go('config');
    case 'mode':
      state.selfhost = arg === 'self';
      if (state.screen === 'config') state.cfg = state.selfhost ? 'integracoes' : 'plano';
      toast(state.selfhost ? 'Protótipo como auto-hospedado: sem planos, cada função aparece com a sua chave' : 'Protótipo como versão hospedada');
      return render();
    case 'sim': simUsage(Number(arg)); return render();
    case 'ai-on': state.ai.optin = true; toast('Resumos em texto ligados'); return render();
    case 'ai-off': state.ai.optin = false; toast('Resumos desligados. Nada mais é enviado'); return render();
    case 'payload': return openPayload();
    case 'regen':
      if (consume('explicacoes', 3)) { const d = new Date(); state.ai.gen = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); toast('Resumo escrito de novo'); }
      return render();
    case 'wa-say': return waSend(arg);
    case 'wa-fill-phone': w.phone = '(11) 98765-4321'; return render();
    case 'wa-send':
      if (w.phone.replace(/\D/g, '').length < 10) return toast('Informe o número com DDD');
      w.status = 'code'; w.code = ''; toast('Código enviado pelo WhatsApp'); return render();
    case 'wa-resend': return toast('Novo código enviado');
    case 'wa-change': w.status = 'idle'; return render();
    case 'wa-fill-code': w.code = '482913'; return render();
    case 'wa-verify':
      if (w.code.replace(/\D/g, '').length !== 6) return toast('O código tem 6 dígitos');
      if (!state.ai.optin) { if (!w.consent) return; state.ai.optin = true; }
      w.status = 'linked'; w.since = TODAY;
      w.msgs = [{who:'vera', text:'Número confirmado. Exemplos do que você pode mandar: "quanto gastei com delivery?", "marca reunião sexta às 15h", "me lembra de aportar todo dia 5". Pix e pagamentos a Vera não faz.'}];
      toast('WhatsApp vinculado'); return render();
    case 'wa-unlink':
      return confirmSheet({t:'Desvincular o WhatsApp?', ok:'Desvincular', body:`<p style="margin:0">A Vera para de responder em <b>+55 ${esc(w.phone)}</b>, os lembretes criados por lá são cancelados e o histórico da conversa sai daqui. Dá para vincular de novo quando quiser.</p>`,
        onOk:() => { Object.assign(w, {status:'idle', code:'', since:null, msgs:[], consent:false}); state.reminders = []; toast('WhatsApp desvinculado'); render(); }});
    case 'gcal-connect': return openGcal();
    case 'gcal-off': state.gcal.on = false; state.events = state.events.filter(e => !e.mine); toast('Google Agenda desconectado e permissão revogada'); return render();
    case 'rem-del': state.reminders.splice(Number(arg), 1); toast('Lembrete apagado'); return render();
    case 'sub-cancel':
      return confirmSheet({t:'Cancelar o Premium?', ok:'Cancelar assinatura', body:`<p style="margin:0 0 12px">Você não será cobrada de novo. O Premium continua ativo até <b>${NEXT_BILL}</b>. Depois disso:</p>
        <ul class="ministeps"><li>Os resumos em texto e a Vera no WhatsApp param; o número e o Google Agenda são desconectados.</li><li><b>Carteira, metas, gastos e regras ficam como estão</b>, no Free.</li><li>Dá para assinar de novo quando quiser.</li></ul>`,
        onOk:() => { state.sub.status = 'canceling'; toast(`Assinatura cancelada. Premium vale até ${NEXT_BILL}`); render(); }});
    case 'sub-reactivate': state.sub.status = 'active'; toast('Assinatura reativada'); return render();
    case 'sub-method': state.sub.method = state.sub.method === 'pix' ? 'card' : 'pix'; toast(state.sub.method === 'pix' ? 'Próximas cobranças por Pix' : 'Cartão final 4242 salvo no Asaas'); return render();
    case 'receipt': return toast('Recibo de 09/10/2026 gerado (no protótipo o download fica desativado)');
    case 'export-all': return toast('vera-meus-dados.zip gerado (no protótipo o download fica desativado)');
    case 'delete-account':
      return sheet(() => mHead('Excluir conta') + `<div class="sheet-single" style="display:grid;gap:12px">
          <p style="margin:0">Isso apaga para sempre a carteira, metas, transações, regras e lembretes, e desconecta bancos, WhatsApp e Google${state.plan === 'premium' && !state.selfhost ? '. O Premium é cancelado, sem novas cobranças' : ''}. Não dá para desfazer.</p>
          <p class="tipbox" style="margin:0">Quer guardar uma cópia? <button class="linkbtn" data-m="export">Exporte seus dados</button> antes.</p>
          <div class="field"><label for="del-confirm">Para confirmar, escreva EXCLUIR</label><input class="input" id="del-confirm" autocomplete="off"></div>
        </div><div class="sheet-foot"><button class="btn ghost" data-close>Voltar</button><button class="btn danger solid" data-m="del" id="del-btn" disabled>Excluir minha conta</button></div>`,
      (a2, el, h) => {
        if (a2 === 'input' && el.id === 'del-confirm') { document.getElementById('del-btn').disabled = el.value.trim().toUpperCase() !== 'EXCLUIR'; return; }
        if (a2 === 'export') return toast('vera-meus-dados.zip gerado (protótipo)');
        if (a2 === 'del') {
          h.close();
          positions = []; Object.assign(state, {sample:false, pluggy:'idle', imported:null, plan:'free', sub:null, auth:false, screen:'visao', cfg:'plano'});
          state.ai.optin = false; Object.assign(state.wa, {status:'idle', phone:'', code:'', msgs:[]}); state.gcal.on = false; state.reminders = []; simUsage(0);
          state.onb = {open:true, step:0, skipped:{}};
          toast('Conta excluída (protótipo)'); render();
        }
      });
    case 'key': return openKey(arg);
    case 'key-del': state.keys[arg] = false; toast('Chave removida: a função some do app'); return render();
  }
}

const start = (location.hash || '').slice(1);
if (ALIAS[start]) { state.cfg = ALIAS[start][1]; state.screen = 'config'; } else if (screens[start]) state.screen = start;
render();
</script>

</body>
</html>
