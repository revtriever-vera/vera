# Vera auto-hospedada: API, front-end, Postgres e Redis em uma máquina só.
# Copie `.env.example` para `.env`, preencha os segredos e rode `docker compose up -d --build`.
# Guia completo: README.md, seção "Instalar com Docker Compose".
name: vera

x-api: &api
  build:
    context: https://github.com/revtriever-vera/vera-api.git#${VERA_API_REF:-main}
  restart: unless-stopped
  env_file: .env
  environment: &api-env
    NODE_ENV: production
    IS_LOCAL: 'false'
    DEPLOY_ENV: prod
    DEPLOYMENT_MODE: self_hosted
    DATABASE_URL: postgres://vera:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/vera
    REDIS_CLUSTER: 'false'
    REDIS_NODES: redis:6379
    SECRET_SEALER_DRIVER: local
    SECRET_SEALER_ALLOW_LOCAL_IN_PROD: 'true'
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    # Cobrança e Pluggy ficam desligados: fora do ambiente local o motor de cobrança só liga com REVTRIEVER_API_KEY e
    # REVTRIEVER_PLAN_ID, e o Pluggy só com credencial; sem elas as rotas respondem "provider_disabled".
  depends_on: &api-deps
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: vera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vera']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Roda as migrações e termina; a API só sobe depois dele.
  migrate:
    <<: *api
    restart: 'no'
    command: ['npx', 'kysely', 'migrate:latest']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - '${API_PORT:-3333}:3333'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Consumidor de filas extra, opcional: `docker compose --profile worker up -d`.
  # A própria API já consome as filas; suba este só se quiser mais capacidade de processamento em segundo plano.
  worker:
    <<: *api
    profiles: [worker]
    environment:
      <<: *api-env
      PORT: '3334'
      DOCS_ENABLED: 'false'
      QUEUES_DASHBOARD_ENABLED: 'false'

  web:
    build:
      context: ./docker/web
      args:
        WEB_REF: ${VERA_WEB_REF:-main}
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3333}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
        VITE_TERMS_URL: ${VITE_TERMS_URL:-}
        VITE_PRIVACY_URL: ${VITE_PRIVACY_URL:-}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

  # Caixa de entrada de teste para os e-mails. Em produção, aponte SMTP_HOST para o seu servidor SMTP e remova este serviço.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'

volumes:
  pgdata:
  redisdata:
